<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Car Price Predictor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h1>🚗 Car Price Predictor</h1>
  <p class="subtitle">Fill in the car details to get an estimated resale price</p>

  <form id="predictForm">

    <div class="grid">
      <div class="field">
        <label>Brand</label>
        <select id="Brand" required>
          {% for b in brand_options %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Body Type</label>
        <select id="body_type" required>
          {% for b in body_options %}<option value="{{ b }}">{{ b }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Fuel Type</label>
        <select id="fuel_type" required>
          {% for f in fuel_options %}<option value="{{ f }}">{{ f }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Transmission</label>
        <select id="transmission_type" required>
          <option value="Manual">Manual</option>
          <option value="Automatic">Automatic</option>
        </select>
      </div>

      <div class="field">
        <label>Owner Type</label>
        <select id="owner_type" required>
          {% for o in owner_options %}<option value="{{ o }}">{{ o }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Insurance</label>
        <select id="insurance" required>
          {% for i in insurance_options %}<option value="{{ i }}">{{ i }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label>City</label>
        <select id="city" required>
          {% for c in city_options %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
        </select>
      </div>

      <div class="field">
        <label>Manufacturing Year</label>
        <input type="number" id="Year" placeholder="e.g. 2018" required>
      </div>

      <div class="field">
        <label>Registered Year</label>
        <input type="number" id="registered_year" placeholder="e.g. 2018" required>
      </div>

      <div class="field">
        <label>Kilometers Driven</label>
        <input type="number" id="driven" placeholder="e.g. 45000" required>
      </div>

      <div class="field">
        <label>Max Power (bhp)</label>
        <input type="number" step="0.1" id="max_power" placeholder="e.g. 88.5" required>
      </div>

      <div class="field">
        <label>Engine Size (cc)</label>
        <input type="number" id="engine_size" placeholder="e.g. 1197" required>
      </div>

      <div class="field">
        <label>Seats</label>
        <input type="number" id="seats" placeholder="e.g. 5" required>
      </div>

      <div class="field">
        <label>Mileage (avg, km/l)</label>
        <input type="number" step="0.1" id="avg" placeholder="e.g. 18.5" required>
      </div>
    </div>

    <button type="submit">Predict Price</button>
  </form>

  <div id="resultBox" class="result-box hidden">
    <span id="resultText"></span>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
